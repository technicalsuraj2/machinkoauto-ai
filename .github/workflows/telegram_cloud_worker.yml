name: 24/7 Telegram AI Executive Manager Cloud Daemon

on:
  workflow_dispatch:
  schedule:
    # Backup safety net triggers every 2 hours
    - cron: '0 */2 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-manager-cloud
  cancel-in-progress: true

jobs:
  run-telegram-ai:
    name: Run 24/7 Telegram Manager Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install telethon requests python-dotenv yt-dlp

      - name: Run Telegram AI Executive Daemons (Bot & User Account)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CREATOR_ID: ${{ secrets.TELEGRAM_CREATOR_ID }}
          TELEGRAM_CREATOR_USERNAME: ${{ secrets.TELEGRAM_CREATOR_USERNAME }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -u storage/scripts/run_cloud_telegram.py
