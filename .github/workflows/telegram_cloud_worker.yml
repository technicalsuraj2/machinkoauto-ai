name: 24/7 Telegram AI Executive Manager Cloud Daemon

on:
  workflow_dispatch:
  schedule:
    # Automatically triggers every 5 hours to stay perpetually online
    - cron: '0 */5 * * *'

jobs:
  run-telegram-ai:
    name: Run 24/7 Telegram Userbot Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install telethon python-dotenv requests

      - name: Run Telegram AI Manager Cloud Daemon
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CREATOR_USERNAME: ${{ secrets.TELEGRAM_CREATOR_USERNAME }}
          TELEGRAM_CREATOR_ID: ${{ secrets.TELEGRAM_CREATOR_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          STATS_API_URL: "https://machinkoauto-ai.netlify.app/api/channel/stats"
        run: |
          python -u storage/scripts/telegram_userbot.py
