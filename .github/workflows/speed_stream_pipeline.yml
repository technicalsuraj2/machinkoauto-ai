name: 24/7 IShowSpeed HD Stream Clipper & Stager

on:
  schedule:
    # Runs daily at 22:00 UTC (3:30 AM IST) to clip Speed's stream and stage for morning upload
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      clip_count:
        description: 'Number of HD viral moments to clip and stage'
        required: true
        default: '10'

jobs:
  clip-speed-stream:
    name: Clip IShowSpeed Live Stream to 1080p HD
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install yt-dlp python-dotenv

      - name: Run IShowSpeed Stream Clipper
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CREATOR_ID: ${{ secrets.TELEGRAM_CREATOR_ID }}
        run: |
          python -u storage/scripts/speed_stream_clipper.py clip ${{ github.event.inputs.clip_count || 10 }}
