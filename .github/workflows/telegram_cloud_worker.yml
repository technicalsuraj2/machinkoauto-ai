name: 24/7 Telegram AI Executive Manager Cloud Daemon

on:
  workflow_dispatch:
  schedule:
    # Automatically triggers every 4 hours to stay perpetually online
    - cron: '0 */4 * * *'

concurrency:
  group: telegram-manager-cloud
  cancel-in-progress: true

jobs:
  run-telegram-ai:
    name: Run 24/7 Telegram Manager Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install requests python-dotenv yt-dlp

      - name: Run Telegram AI Manager Cloud Daemon
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CREATOR_ID: ${{ secrets.TELEGRAM_CREATOR_ID }}
          TELEGRAM_CREATOR_USERNAME: ${{ secrets.TELEGRAM_CREATOR_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -u storage/scripts/telegram_manager_bot.py
