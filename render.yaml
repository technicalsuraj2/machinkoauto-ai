services:
  - type: web
    name: machinko-telegram-ai
    runtime: python
    buildCommand: pip install -r requirements-telegram.txt
    startCommand: python -u storage/scripts/telegram_userbot.py
    envVars:
      - key: PORT
        value: 10000
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
